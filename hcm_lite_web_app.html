<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Human Capital Management System</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        saylani: {
                            blue: '#00529B',
                            green: '#62B52F',
                            dark: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for tables & modals */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Print Styles for Payslip */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-payslip, #printable-payslip * {
                visibility: visible;
            }
            #printable-payslip {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- TOP NOTIFICATION BANNER -->
    <div id="toast" class="fixed top-4 right-4 z-50 transform transition-all duration-300 translate-y-[-100px] opacity-0 max-w-md w-full bg-slate-900 text-white p-4 rounded-xl shadow-2xl flex items-center space-x-3 border-l-4 border-saylani-green">
        <i id="toast-icon" class="fas font-info-circle text-xl text-saylani-green"></i>
        <div class="flex-1">
            <h4 id="toast-title" class="text-sm font-semibold">Notification</h4>
            <p id="toast-message" class="text-xs text-slate-300">Action performed successfully.</p>
        </div>
        <button onclick="hideToast()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
    </div>

    <!-- MAIN CONTAINER (Renders App Views dynamically) -->
    <div id="app-container" class="min-h-screen flex flex-col">
        <!-- Dynamic content injected here via JS -->
    </div>

    <!-- SMART HELPER CHAT WIDGET (Included globally for logged-in users) -->
    <div id="smart-helper-widget" class="fixed bottom-6 right-6 z-40 hidden">
        <!-- Chat Bubble Button -->
        <button onclick="toggleChatWindow()" class="bg-saylani-blue hover:bg-blue-800 text-white p-4 rounded-full shadow-2xl flex items-center justify-center space-x-2 transition-all transform hover:scale-105 active:scale-95">
            <i class="fas fa-robot text-2xl"></i>
            <span class="hidden md:inline font-medium text-sm pr-1">Smart Helper</span>
        </button>

        <!-- Chat Window -->
        <div id="chat-window" class="hidden absolute bottom-16 right-0 w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden max-h-[500px] h-[450px]">
            <!-- Header -->
            <div class="bg-saylani-blue text-white p-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fas fa-robot text-sm text-saylani-green"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm">HCM Smart AI Helper</h3>
                        <p class="text-[10px] text-slate-200">Online | Real-time Data Insights</p>
                    </div>
                </div>
                <button onclick="toggleChatWindow()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
            </div>

            <!-- Messages Box -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 text-xs">
                <!-- Helper Welcome Msg -->
                <div class="flex items-start space-x-2">
                    <div class="w-6 h-6 rounded-full bg-saylani-blue text-white flex items-center justify-center flex-shrink-0 text-[10px]">
                        AI
                    </div>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-slate-700 max-w-[80%]">
                        Hello! I am your HCM Smart Helper. Ask me anything about attendance, leaves, or employee stats!
                    </div>
                </div>
            </div>

            <!-- Predefined Quick Questions -->
            <div class="px-3 py-2 bg-white border-t border-slate-100 flex gap-1.5 overflow-x-auto whitespace-nowrap text-[10px]">
                <button onclick="askPreset('Who is on leave today?')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition">Leaves today?</button>
                <button onclick="askPreset('Who was late today?')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition">Late today?</button>
                <button onclick="askPreset('How many employees do we have?')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition">Total Employees?</button>
            </div>

            <!-- Input Form -->
            <form id="chat-form" onsubmit="handleChatSubmit(event)" class="p-3 bg-white border-t border-slate-200 flex space-x-2">
                <input type="text" id="chat-input" placeholder="Type a query (e.g., Was I late today?)..." class="flex-1 px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-saylani-blue">
                <button type="submit" class="bg-saylani-blue text-white px-3 py-2 rounded-lg text-xs font-semibold hover:bg-blue-800 transition">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT APPLICATION LOGIC -->
    <script>
        /**
         * INITIALIZATION & LOCALSTORAGE MANAGEMENT
         */
        const STORAGE_KEYS = {
            COMPANY: 'hcm_company',
            USERS: 'hcm_users',
            ATTENDANCE: 'hcm_attendance',
            LEAVES: 'hcm_leaves',
            SESSION: 'hcm_session'
        };

        // Utility Storage Helpers
        const DB = {
            get: (key) => JSON.parse(localStorage.getItem(key)) || null,
            set: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
            clear: () => localStorage.clear()
        };

        // Initialize App State
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            const company = DB.get(STORAGE_KEYS.COMPANY);
            const session = DB.get(STORAGE_KEYS.SESSION);

            if (!company) {
                // First Run Setup Required
                renderSetupView();
            } else if (!session) {
                // Show Login Screen
                renderLoginView();
            } else {
                // Navigate to User Dashboard based on Role
                if (session.role === 'admin') {
                    renderAdminDashboard();
                } else {
                    renderEmployeeDashboard();
                }
                document.getElementById('smart-helper-widget').classList.remove('hidden');
            }
        }

        /**
         * TOAST NOTIFICATIONS
         */
        function showToast(message, type = 'success', title = 'Notification') {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastTitle.textContent = title;
            toastMsg.textContent = message;

            if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-xl text-rose-500';
                toast.style.borderColor = '#f43f5e';
            } else if (type === 'warning') {
                toastIcon.className = 'fas fa-exclamation-triangle text-xl text-amber-500';
                toast.style.borderColor = '#f59e0b';
            } else {
                toastIcon.className = 'fas fa-check-circle text-xl text-emerald-500';
                toast.style.borderColor = '#10b981';
            }

            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                hideToast();
            }, 4000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('translate-y-[-100px]', 'opacity-0');
            toast.classList.remove('translate-y-0', 'opacity-100');
        }

        /**
         * VIEW 1: FIRST-RUN SETUP (Company & Admin Setup)
         */
        function renderSetupView() {
            document.getElementById('smart-helper-widget').classList.add('hidden');
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-saylani-blue p-4">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-lg w-full">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-saylani-blue/10 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                <i class="fas fa-building text-3xl text-saylani-blue"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">Setup HCM Lite System</h1>
                            <p class="text-slate-500 text-xs mt-1">First-time configuration for your company and admin account</p>
                        </div>

                        <form onsubmit="handleSetupSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Company Name *</label>
                                <input type="text" id="setup-company-name" required placeholder="e.g. Saylani Tech Solutions" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-saylani-blue focus:outline-none">
                            </div>

                            <div class="border-t border-slate-100 pt-3">
                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Admin Credentials</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-700 mb-1">Admin Name *</label>
                                        <input type="text" id="setup-admin-name" required placeholder="Administrator" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-saylani-blue focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-700 mb-1">Admin Email *</label>
                                        <input type="email" id="setup-admin-email" required placeholder="admin@saylani.com" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-saylani-blue focus:outline-none">
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Admin Password *</label>
                                    <input type="password" id="setup-admin-password" required placeholder="••••••••" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-saylani-blue focus:outline-none">
                                </div>
                            </div>

                            <div class="border-t border-slate-100 pt-3">
                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Office Policy Defaults</h3>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Start Time</label>
                                        <input type="time" id="setup-start-time" value="09:00" required class="w-full px-2 py-2 text-xs border border-slate-300 rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Grace (Mins)</label>
                                        <input type="number" id="setup-grace-mins" value="15" min="0" required class="w-full px-2 py-2 text-xs border border-slate-300 rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Leave Quota</label>
                                        <input type="number" id="setup-leave-quota" value="20" min="1" required class="w-full px-2 py-2 text-xs border border-slate-300 rounded-lg">
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3 bg-saylani-blue hover:bg-blue-800 text-white rounded-xl font-semibold shadow-lg shadow-blue-500/30 transition duration-200 mt-4">
                                Complete Initialization <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleSetupSubmit(e) {
            e.preventDefault();
            const companyName = document.getElementById('setup-company-name').value.trim();
            const adminName = document.getElementById('setup-admin-name').value.trim();
            const adminEmail = document.getElementById('setup-admin-email').value.trim();
            const adminPassword = document.getElementById('setup-admin-password').value;
            const startTime = document.getElementById('setup-start-time').value;
            const graceMins = parseInt(document.getElementById('setup-grace-mins').value);
            const leaveQuota = parseInt(document.getElementById('setup-leave-quota').value);

            // Save Company Settings
            const companyObj = {
                name: companyName,
                startTime: startTime,
                graceMins: graceMins,
                leaveQuota: leaveQuota,
                createdAt: new Date().toISOString()
            };

            // Save Admin User
            const adminObj = {
                id: 'usr_' + Date.now(),
                name: adminName,
                email: adminEmail,
                password: adminPassword,
                role: 'admin',
                department: 'Management',
                salary: 150000,
                joinedDate: new Date().toISOString().split('T')[0]
            };

            DB.set(STORAGE_KEYS.COMPANY, companyObj);
            DB.set(STORAGE_KEYS.USERS, [adminObj]);
            DB.set(STORAGE_KEYS.ATTENDANCE, []);
            DB.set(STORAGE_KEYS.LEAVES, []);

            showToast('System setup initialized successfully!', 'success');
            renderLoginView();
        }

        /**
         * VIEW 2: LOGIN VIEW
         */
        function renderLoginView() {
            document.getElementById('smart-helper-widget').classList.add('hidden');
            const company = DB.get(STORAGE_KEYS.COMPANY);
            const container = document.getElementById('app-container');

            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden max-w-md w-full border border-slate-200">
                        <div class="bg-saylani-blue p-6 text-white text-center relative">
                            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/10 rounded-xl mb-2">
                                <i class="fas fa-users-cog text-2xl text-saylani-green"></i>
                            </div>
                            <h2 class="text-xl font-bold">${company ? company.name : 'HCM Lite'}</h2>
                            <p class="text-slate-200 text-xs">Human Capital Management Portal</p>
                        </div>

                        <div class="p-6">
                            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                                    <div class="relative">
                                        <i class="fas fa-envelope absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                                        <input type="email" id="login-email" required placeholder="name@company.com" class="w-full pl-10 pr-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-saylani-blue focus:outline-none">
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                                    <div class="relative">
                                        <i class="fas fa-lock absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-saylani-blue focus:outline-none">
                                    </div>
                                </div>

                                <button type="submit" class="w-full py-3 bg-saylani-blue hover:bg-blue-800 text-white rounded-xl font-semibold shadow-md transition duration-200 text-sm">
                                    Sign In <i class="fas fa-sign-in-alt ml-2"></i>
                                </button>
                            </form>

                            <div class="mt-6 pt-4 border-t border-slate-100 text-center">
                                <p class="text-xs text-slate-400">HCM Lite System &bull; Saylani Hackathon Project</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const users = DB.get(STORAGE_KEYS.USERS) || [];
            const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

            if (!user) {
                showToast('Invalid email or password', 'error', 'Login Failed');
                return;
            }

            // Save active session
            DB.set(STORAGE_KEYS.SESSION, {
                id: user.id,
                name: user.name,
                email: user.email,
                role: user.role,
                department: user.department,
                salary: user.salary
            });

            showToast(`Welcome back, ${user.name}!`, 'success');
            initApp();
        }

        function handleLogout() {
            localStorage.removeItem(STORAGE_KEYS.SESSION);
            showToast('Logged out successfully', 'warning');
            initApp();
        }

        /**
         * LAYOUT WRAPPER (Header & Navigation)
         */
        function renderAppLayout(contentHtml, activeTab = 'dashboard') {
            const company = DB.get(STORAGE_KEYS.COMPANY);
            const session = DB.get(STORAGE_KEYS.SESSION);
            const isAdmin = session.role === 'admin';

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <!-- Navigation Bar -->
                <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex items-center justify-between h-16">
                            <!-- Logo & Company Name -->
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 bg-saylani-blue rounded-xl flex items-center justify-center text-saylani-green font-black text-xl">
                                    H
                                </div>
                                <div>
                                    <h1 class="font-bold text-base leading-tight">${company ? company.name : 'HCM Lite'}</h1>
                                    <span class="text-[10px] uppercase font-semibold text-saylani-green tracking-widest">${session.role} portal</span>
                                </div>
                            </div>

                            <!-- Desktop Nav Links -->
                            <nav class="hidden md:flex space-x-1">
                                ${isAdmin ? `
                                    <button onclick="renderAdminDashboard()" class="px-3 py-2 rounded-lg text-xs font-medium ${activeTab==='dashboard'?'bg-saylani-blue text-white':'text-slate-300 hover:bg-slate-800'}">
                                        <i class="fas fa-chart-line mr-1.5"></i> Dashboard
                                    </button>
                                    <button onclick="renderEmployeesView()" class="px-3 py-2 rounded-lg text-xs font-medium ${activeTab==='employees'?'bg-saylani-blue text-white':'text-slate-300 hover:bg-slate-800'}">
                                        <i class="fas fa-users mr-1.5"></i> Employees
                                    </button>
                                    <button onclick="renderLeavesView()" class="px-3 py-2 rounded-lg text-xs font-medium ${activeTab==='leaves'?'bg-saylani-blue text-white':'text-slate-300 hover:bg-slate-800'}">
                                        <i class="fas fa-calendar-check mr-1.5"></i> Leave Requests
                                    </button>
                                    <button onclick="renderSettingsView()" class="px-3 py-2 rounded-lg text-xs font-medium ${activeTab==='settings'?'bg-saylani-blue text-white':'text-slate-300 hover:bg-slate-800'}">
                                        <i class="fas fa-cog mr-1.5"></i> Settings
                                    </button>
                                ` : `
                                    <button onclick="renderEmployeeDashboard()" class="px-3 py-2 rounded-lg text-xs font-medium ${activeTab==='dashboard'?'bg-saylani-blue text-white':'text-slate-300 hover:bg-slate-800'}">
                                        <i class="fas fa-user-clock mr-1.5"></i> Attendance & Leaves
                                    </button>
                                `}
                                <button onclick="renderPayslipView('${session.id}')" class="px-3 py-2 rounded-lg text-xs font-medium ${activeTab==='payslip'?'bg-saylani-blue text-white':'text-slate-300 hover:bg-slate-800'}">
                                    <i class="fas fa-file-invoice-dollar mr-1.5"></i> Payslip
                                </button>
                            </nav>

                            <!-- Profile & Logout -->
                            <div class="flex items-center space-x-3">
                                <div class="text-right hidden sm:block">
                                    <p class="text-xs font-semibold text-white leading-none">${session.name}</p>
                                    <p class="text-[10px] text-slate-400 mt-0.5">${session.department}</p>
                                </div>
                                <button onclick="handleLogout()" class="p-2 bg-slate-800 hover:bg-rose-600/20 text-slate-300 hover:text-rose-400 rounded-xl transition text-xs flex items-center space-x-1" title="Logout">
                                    <i class="fas fa-sign-out-alt text-sm"></i>
                                    <span class="hidden sm:inline">Logout</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Mobile Navigation Bar -->
                    <div class="md:hidden bg-slate-800 px-2 py-1.5 border-t border-slate-700 flex justify-around text-[10px]">
                        ${isAdmin ? `
                            <button onclick="renderAdminDashboard()" class="p-2 ${activeTab==='dashboard'?'text-saylani-green':'text-slate-300'}"><i class="fas fa-chart-line block text-center text-sm"></i> Home</button>
                            <button onclick="renderEmployeesView()" class="p-2 ${activeTab==='employees'?'text-saylani-green':'text-slate-300'}"><i class="fas fa-users block text-center text-sm"></i> Staff</button>
                            <button onclick="renderLeavesView()" class="p-2 ${activeTab==='leaves'?'text-saylani-green':'text-slate-300'}"><i class="fas fa-calendar-check block text-center text-sm"></i> Leaves</button>
                            <button onclick="renderSettingsView()" class="p-2 ${activeTab==='settings'?'text-saylani-green':'text-slate-300'}"><i class="fas fa-cog block text-center text-sm"></i> Config</button>
                        ` : `
                            <button onclick="renderEmployeeDashboard()" class="p-2 ${activeTab==='dashboard'?'text-saylani-green':'text-slate-300'}"><i class="fas fa-user-clock block text-center text-sm"></i> Attendance</button>
                        `}
                        <button onclick="renderPayslipView('${session.id}')" class="p-2 ${activeTab==='payslip'?'text-saylani-green':'text-slate-300'}"><i class="fas fa-file-invoice-dollar block text-center text-sm"></i> Payslip</button>
                    </div>
                </header>

                <!-- Dynamic Page View Container -->
                <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                    ${contentHtml}
                </main>
            `;
        }

        /**
         * VIEW 3: ADMIN DASHBOARD
         */
        function renderAdminDashboard() {
            const users = DB.get(STORAGE_KEYS.USERS) || [];
            const employees = users.filter(u => u.role === 'employee');
            const attendance = DB.get(STORAGE_KEYS.ATTENDANCE) || [];
            const leaves = DB.get(STORAGE_KEYS.LEAVES) || [];

            const todayStr = new Date().toISOString().split('T')[0];
            const todayAttendance = attendance.filter(a => a.date === todayStr);

            const presentCount = todayAttendance.filter(a => a.status === 'Present' || a.status === 'Late').length;

        function openAddEmployeeModal() {
            document.getElementById('add-emp-modal').classList.remove('hidden');
        }

        function closeAddEmployeeModal() {
            document.getElementById('add-emp-modal').classList.add('hidden');
        }

        function handleAddEmployeeSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('emp-name').value.trim();
            const email = document.getElementById('emp-email').value.trim();
            const password = document.getElementById('emp-password').value;
            const department = document.getElementById('emp-department').value;
            const salary = parseFloat(document.getElementById('emp-salary').value);

            const users = DB.get(STORAGE_KEYS.USERS) || [];

            // Duplicate Email Guard
            if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                showToast('An account with this email already exists', 'error');
                return;
            }

            const newEmployee = {
                id: 'emp_' + Date.now(),
                name,
                email,
                password,
                role: 'employee',
                department,
                salary,
                joinedDate: new Date().toISOString().split('T')[0]
            };

            users.push(newEmployee);
            DB.set(STORAGE_KEYS.USERS, users);

            showToast(`Employee ${name} registered successfully!`, 'success');
            closeAddEmployeeModal();
            renderEmployeesView();
        }

        function deleteEmployee(empId) {
            if (!confirm('Are you sure you want to delete this employee account?')) return;

            let users = DB.get(STORAGE_KEYS.USERS) || [];
            users = users.filter(u => u.id !== empId);
            DB.set(STORAGE_KEYS.USERS, users);

            showToast('Employee deleted successfully', 'warning');
            renderEmployeesView();
        }

        /**
         * ATTENDANCE CHECK-IN / CHECK-OUT LOGIC
         */
        function handleCheckIn() {
            const session = DB.get(STORAGE_KEYS.SESSION);
            const company = DB.get(STORAGE_KEYS.COMPANY);
            let attendance = DB.get(STORAGE_KEYS.ATTENDANCE) || [];

            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const checkInTimeStr = now.toTimeString().split(' ')[0].substring(0, 5); // HH:MM

            // Calculate Status based on Company Start Time & Grace Minutes
            const [startHour, startMin] = company.startTime.split(':').map(Number);
            const startTimeInMins = startHour * 60 + startMin;
            const graceThresholdMins = startTimeInMins + company.graceMins;

            const [curHour, curMin] = checkInTimeStr.split(':').map(Number);
            const checkInInMins = curHour * 60 + curMin;

            let status = 'Present';
            if (checkInInMins > graceThresholdMins) {
                status = 'Late';
            }

            const newRecord = {
                id: 'att_' + Date.now(),
                employeeId: session.id,
                date: todayStr,
                checkIn: checkInTimeStr,
                checkOut: null,
                status: status,
                workHours: 0
            };

            attendance.push(newRecord);
            DB.set(STORAGE_KEYS.ATTENDANCE, attendance);

            showToast(`Checked in successfully at ${checkInTimeStr} (${status})`, status === 'Late' ? 'warning' : 'success');
            renderEmployeeDashboard();
        }

        function handleCheckOut() {
            const session = DB.get(STORAGE_KEYS.SESSION);
            let attendance = DB.get(STORAGE_KEYS.ATTENDANCE) || [];

            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const checkOutTimeStr = now.toTimeString().split(' ')[0].substring(0, 5);

            const recordIdx = attendance.findIndex(a => a.employeeId === session.id && a.date === todayStr);
            if (recordIdx === -1) return;

            const record = attendance[recordIdx];
            record.checkOut = checkOutTimeStr;

            // Calculate work hours
            const [inH, inM] = record.checkIn.split(':').map(Number);
            const [outH, outM] = checkOutTimeStr.split(':').map(Number);

            const durationMins = (outH * 60 + outM) - (inH * 60 + inM);
            const hoursWorked = durationMins / 60;
            record.workHours = parseFloat(hoursWorked.toFixed(1));

            // Business Rule: If work hours < 5 hours, mark as Half-Day
            if (hoursWorked < 5) {
                record.status = 'Half-Day';
            }

            attendance[recordIdx] = record;
            DB.set(STORAGE_KEYS.ATTENDANCE, attendance);

            showToast(`Checked out at ${checkOutTimeStr}. Total worked: ${record.workHours} hrs`, 'info');
            renderEmployeeDashboard();
        }

        /**
         * LEAVE APPLICATION SUBMIT
         */
        function handleApplyLeaveSubmit(e) {
            e.preventDefault();
            const session = DB.get(STORAGE_KEYS.SESSION);
            const company = DB.get(STORAGE_KEYS.COMPANY);
            const leaves = DB.get(STORAGE_KEYS.LEAVES) || [];

            const type = document.getElementById('leave-type').value;
            const fromDate = document.getElementById('leave-from').value;
            const toDate = document.getElementById('leave-to').value;
            const reason = document.getElementById('leave-reason').value.trim();

            if (fromDate > toDate) {
                showToast('From Date cannot be after To Date', 'error');
                return;
            }

            // Calculate requested working days
            const start = new Date(fromDate);
            const end = new Date(toDate);
            let dayCount = 0;
            let cur = new Date(start);

            while (cur <= end) {
                const dayOfWeek = cur.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { // Skip weekends (Sat/Sun)
                    dayCount++;
                }
                cur.setDate(cur.getDate() + 1);
            }

            if (dayCount === 0) {
                showToast('Selected date range only covers weekend days', 'error');
                return;
            }

            // Check Leave Balance Quota
            const myApprovedDays = leaves
                .filter(l => l.employeeId === session.id && l.status === 'Approved')
                .reduce((sum, l) => sum + parseInt(l.days), 0);

            if (myApprovedDays + dayCount > company.leaveQuota) {
                showToast(`Quota Exceeded! You only have ${company.leaveQuota - myApprovedDays} leave days remaining.`, 'error');
                return;
            }

            const newLeave = {
                id: 'lv_' + Date.now(),
                employeeId: session.id,
                type,
                fromDate,
                toDate,
                days: dayCount,
                reason,
                status: 'Pending',
                adminComment: ''
            };

            leaves.push(newLeave);
            DB.set(STORAGE_KEYS.LEAVES, leaves);

            showToast(`Leave application for ${dayCount} day(s) submitted!`, 'success');
            renderEmployeeDashboard();
        }

        /**

        function renderPayslipView(employeeId) {

            const company = DB.get(STORAGE_KEYS.COMPANY);

            if (!targetUser) return;

            // Compute Current Month Stats
            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            // Total working days in month (Assumed standard 22 days for demo)
            const standardWorkingDays = 22;
            const perDaySalary = targetUser.salary / standardWorkingDays;

            // Attendance records for current month
            const monthRecords = attendance.filter(a => a.employeeId === targetUser.id && a.date.startsWith(currentMonthStr));
            
            const presentDays = monthRecords.filter(a => a.status === 'Present' || a.status === 'Late').length;
            const halfDays = monthRecords.filter(a => a.status === 'Half-Day').length;
            
            // Unexcused Absences = Total Working Days - (Present Days + Half Days)
            const absentDays = Math.max(0, standardWorkingDays - (presentDays + halfDays));

            // Salary Deductions Calculation Formula: Per Day * (Absent Days + 0.5 * Half Days)
            const deductions = Math.round(perDaySalary * (absentDays + (0.5 * halfDays)));

                                <p class="text-xs text-slate-400 mt-1">Date: ${new Date().toLocaleDateString()}</p>
                            </div>
                        </div>

                        <!-- Employee Details -->
                        <div class="grid grid-cols-2 gap-4 my-6 text-xs bg-slate-50 p-4 rounded-xl">
                            <div>
                                <span class="text-slate-400 font-medium block">Employee Name</span>

                            </div>

                                <span class="text-slate-400 font-medium block">Department</span>

                            <div>

                                <span class="font-semibold text-slate-800">${targetUser.email}</span>

                        <!-- Attendance Breakdown -->
                        <div class="mb-6">

                                <div class="p-3 bg-rose-50 rounded-xl">

                        <!-- Earnings & Deductions Table -->

        /**
         * SMART HELPER CHATBOT LOGIC
         */
        function toggleChatWindow() {
            const chatWin = document.getElementById('chat-window');
            chatWin.classList.toggle('hidden');
        }

        function askPreset(question) {
            document.getElementById('chat-input').value = question;
            handleChatSubmit(new Event('submit'));
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const query = inputEl.value.trim();
            if (!query) return;

            appendChatMessage('user', query);
            inputEl.value = '';

            // Engine Processing Answer
            setTimeout(() => {
                const answer = processSmartHelperQuery(query);
                appendChatMessage('ai', answer);
            }, 300);
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            
            if (sender === 'user') {
                msgDiv.className = 'flex items-start justify-end space-x-2';
                msgDiv.innerHTML = `
                    <div class="bg-saylani-blue text-white p-3 rounded-2xl rounded-tr-none shadow-sm max-w-[80%]">
                        ${text}
                    </div>
                `;
            } else {
                msgDiv.className = 'flex items-start space-x-2';
                msgDiv.innerHTML = `
                    <div class="w-6 h-6 rounded-full bg-saylani-blue text-white flex items-center justify-center flex-shrink-0 text-[10px]">
                        AI
                    </div>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-slate-700 max-w-[80%]">
                        ${text}
                    </div>
                `;
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        /**
         * SMART HELPER KEYWORD MATCHING ENGINE
         */
        function processSmartHelperQuery(q) {
            const query = q.toLowerCase();
            const session = DB.get(STORAGE_KEYS.SESSION);
            const users = DB.get(STORAGE_KEYS.USERS) || [];
            const attendance = DB.get(STORAGE_KEYS.ATTENDANCE) || [];
            const leaves = DB.get(STORAGE_KEYS.LEAVES) || [];
            const company = DB.get(STORAGE_KEYS.COMPANY);
            const todayStr = new Date().toISOString().split('T')[0];

            // ADMIN QUERY 1: How many employees?
            if (query.includes('how many employees') || query.includes('total staff')) {
                const empCount = users.filter(u => u.role === 'employee').length;
                return `We currently have <b>${empCount}</b> employee(s) registered in the system.`;
            }

            // ADMIN QUERY 2: Who is on leave today?
            if (query.includes('on leave today')) {
                const onLeaveToday = leaves.filter(l => l.status === 'Approved' && todayStr >= l.fromDate && todayStr <= l.toDate);
                if (onLeaveToday.length === 0) return "No employees are on leave today.";
                
                const names = onLeaveToday.map(l => {
                    const u = users.find(usr => usr.id === l.employeeId);
                    return u ? u.name : 'Unknown';
                }).join(', ');
                return `The following ${onLeaveToday.length} employee(s) are on approved leave today: <b>${names}</b>.`;
            }

            // ADMIN QUERY 3: Who was late today?
            if (query.includes('late today')) {
                const lateToday = attendance.filter(a => a.date === todayStr && a.status === 'Late');
                if (lateToday.length === 0) return "No employees were late today! Great compliance.";
                
                const names = lateToday.map(a => {
                    const u = users.find(usr => usr.id === a.employeeId);
                    return u ? `${u.name} (In at ${a.checkIn})` : 'Unknown';
                }).join(', ');
                return `The following employee(s) checked in late today: <b>${names}</b>.`;
            }

            // EMPLOYEE QUERY 1: How many leaves do I have left?
            if (query.includes('leaves') && (query.includes('left') || query.includes('balance') || query.includes('remaining'))) {
                const myApproved = leaves
                    .filter(l => l.employeeId === session.id && l.status === 'Approved')
                    .reduce((sum, l) => sum + parseInt(l.days), 0);
                const remaining = company.leaveQuota - myApproved;
                return `You have <b>${remaining}</b> leave day(s) remaining out of your total ${company.leaveQuota} annual quota.`;
            }

            // EMPLOYEE QUERY 2: Was I late today?
            if (query.includes('was i late')) {
                const myToday = attendance.find(a => a.employeeId === session.id && a.date === todayStr);
                if (!myToday) return "You haven't checked in yet today.";
                if (myToday.status === 'Late') return `Yes, you checked in at ${myToday.checkIn}, which was past the grace period.`;
                return `No, you checked in on time at ${myToday.checkIn}!`;
            }

            // EMPLOYEE QUERY 3: How many hours did I work this week?
            if (query.includes('hours') && query.includes('work')) {
                const myRecords = attendance.filter(a => a.employeeId === session.id);
                const totalHours = myRecords.reduce((sum, r) => sum + (r.workHours || 0), 0);
                return `You have recorded a total of <b>${totalHours.toFixed(1)}</b> working hours across all logged check-outs.`;
            }

            // Default fallback
            return "I'm not sure I understood that question. You can ask me: <i>'Who is on leave today?'</i>, <i>'Who was late today?'</i>, or <i>'How many leaves do I have left?'</i>";
        }
    </script>
